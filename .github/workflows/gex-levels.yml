name: GEX levels

# Pull CBOE's delayed option chains and write gex/latest.txt and gex/history.txt
# (the one to paste into A.W. Strategy on TradingView), with Kronos forecasts added: once
# before the US open, then every 30 minutes through the session. Run it by hand from the Actions tab
# ("Run workflow") whenever you want fresh levels.
on:
  schedule:
    # GitHub delays or drops scheduled runs when it's busy, most of all at the top and
    # half of the hour, so these run at odd minutes. Run it by hand when it matters.
    - cron: "37 12 * * 1-5"         # 8:37 New York in summer, 7:37 in winter
    - cron: "7,37 13-21 * * 1-5"    # every 30 min, covering 9:30-16:00 New York all year
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gex-levels
  cancel-in-progress: false

jobs:
  levels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: forecast/requirements.txt
      - name: Compute GEX levels from CBOE
        run: python gex/gex_levels.py
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kronos-small-v1
      # Kronos (shiyu-coder/Kronos) forecasts the next 2 hours for NQ, ES, RTY, YM and
      # gold. If anything here fails, the GEX levels still get committed.
      - name: Kronos forecasts
        continue-on-error: true
        timeout-minutes: 20
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet -r forecast/requirements.txt
          python forecast/kronos_forecast.py
      - name: Commit the levels
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gex/latest.txt gex/history.txt
          [ -f forecast/log.csv ] && git add forecast/log.csv
          git diff --cached --quiet && exit 0
          git commit -m "GEX levels $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push
